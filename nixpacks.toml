[phases.setup]
nixPkgs = ["python311", "nodejs_18"]

[phases.install]
cmds = ["curl -sS https://bootstrap.pypa.io/get-pip.py -o /tmp/get-pip.py", "python3 /tmp/get-pip.py --user", "cd backend && /root/.local/bin/pip install -r requirements.txt"]

[start]
cmd = "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
