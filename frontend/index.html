    <!-- Google AdSense + Microsoft Clarity : détection adblocker 100% LOCALE
         (élément "bait" masqué par les règles cosmétiques de l'adblocker).
         Aucune requête réseau de sonde => zéro ligne d'erreur console.
         - Adblocker détecté  : on ne charge rien, AdComponent affiche le
           placeholder, Clarity reste un stub no-op. Console 100% propre.
         - Pas d'adblocker    : injection différée des vrais scripts (ils
           réussissent => pas d'erreur non plus).
         Note : les requêtes bloquées par un adblocker sont loguées par le
         navigateur lui-même (ERR_BLOCKED_BY_CLIENT) et aucun JS ne peut les
         masquer — d'où cette approche qui évite toute requête inutile. -->
    <script>
      (function () {
        // Détection synchrone, sans réseau : les adblockers injectent des
        // règles CSS qui masquent les éléments de classe "ads/adsbox".
        function isAdBlocked() {
          try {
            if (!document.body) return false;
            var d = document.createElement('div');
            d.className = 'ads adsbox ad-banner pub_300x250 text-ad';
            d.style.cssText = 'position:absolute!important;left:-9999px!important;top:0!important;width:1px!important;height:1px!important;';
            d.setAttribute('aria-hidden', 'true');
            document.body.appendChild(d);
            var blocked = false;
            try {
              var s = window.getComputedStyle(d);
              blocked = (d.offsetHeight === 0) || (s && (s.display === 'none' || s.visibility === 'hidden'));
            } catch (e) { blocked = false; }
            d.remove();
            return blocked;
          } catch (e) { return false; }
        }
        function injectAdsense() {
          if (window.adsbygoogle || window.__adsenseBlocked || document.querySelector('script[data-adsense]')) return;
          var s = document.createElement('script');
          s.async = true;
          s.crossOrigin = 'anonymous';
          s.setAttribute('data-adsense', '1');
          s.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9172635804207966';
          // Si blocage résiduel (ex: Brave Shields non détecté par le bait),
          // onerror => placeholder, jamais d'exception.
          s.onerror = function () { window.__adsenseBlocked = true; };
          document.head.appendChild(s);
        }
        function injectClarity(id) {
          if (document.querySelector('script[data-clarity]')) return;
          try {
            // Stub no-op : si Clarity finit bloqué, les appels clarity()
            // restent silencieux au lieu de lever un TypeError.
            window.clarity = window.clarity || function () { (window.clarity.q = window.clarity.q || []).push(arguments); };
            var t = document.createElement('script');
            t.async = true;
            t.setAttribute('data-clarity', '1');
            t.src = 'https://www.clarity.ms/tag/' + id;
            t.onerror = function () {};
            var y = document.getElementsByTagName('script')[0];
            y.parentNode.insertBefore(t, y);
          } catch (e) {}
        }
        // Un résidu Clarity partiellement chargé ne doit jamais produire
        // d'Uncaught TypeError en console.
        window.addEventListener('error', function (e) {
          if (e && e.filename && e.filename.indexOf('clarity.ms') !== -1) {
            if (e.preventDefault) e.preventDefault();
            return true;
          }
        }, true);
        function boot() {
          var blocked = false;
          try { blocked = isAdBlocked(); } catch (e) { blocked = false; }
          if (blocked) {
            window.__adsenseBlocked = true; // AdComponent => placeholder direct
            return; // Clarity : on ne tente même pas, stub inutile (aucun appel)
          }
          injectAdsense();
          injectClarity('xq6fqslzqx');
        }
        // Différé : ne bloque jamais le premier rendu / l'analyse CV.
        if (document.readyState === 'complete') { setTimeout(boot, 3000); }
        else { window.addEventListener('load', function () { setTimeout(boot, 3000); }); }
      })();
    </script>
